<title>Kreuzblock</title>
<style>
:root{
  --paper:#F3F6FA; --grid:rgba(60,100,160,.09); --card:#FFFFFF; --card2:#EEF2F7; --line:#DCE3EB;
  --ink:#1D2127; --ink2:#59626E; --ink3:#8D96A2; --pen:#1D2127;
  --btn:#1D2127; --btn-ink:#FFFFFF; --danger:#C8352C; --ok:#1E8E52; --scrim:rgba(12,16,22,.45);
  --r-c:#DA3B32; --r-t:#F8DCD9; --r-i:#A8261E; --r-on:#FFFFFF;
  --y-c:#E9A800; --y-t:#FBEDC2; --y-i:#7D5800; --y-on:#2B2000;
  --g-c:#23955A; --g-t:#D3EEDF; --g-i:#136A3C; --g-on:#FFFFFF;
  --b-c:#2A66D9; --b-t:#DAE5FA; --b-i:#1B48A3; --b-on:#FFFFFF;
  --shadow:0 1px 2px rgba(25,35,50,.06),0 4px 14px rgba(25,35,50,.07);
  --st:env(safe-area-inset-top,0px); --sb:env(safe-area-inset-bottom,0px);
  --sl:env(safe-area-inset-left,0px); --sr:env(safe-area-inset-right,0px);
}
@media (prefers-color-scheme:dark){:root{
  --paper:#14181D; --grid:rgba(255,255,255,.035); --card:#1D232A; --card2:#262D36; --line:#323A44;
  --ink:#ECEFF3; --ink2:#A2ABB6; --ink3:#6E7884; --pen:#F4F6F8;
  --btn:#ECEFF3; --btn-ink:#14181D; --danger:#F06A60; --ok:#4CC383; --scrim:rgba(0,0,0,.6);
  --r-c:#EE5248; --r-t:#3A2226; --r-i:#FF9F98; --r-on:#FFFFFF;
  --y-c:#F2BE2E; --y-t:#383120; --y-i:#F6D57C; --y-on:#2B2000;
  --g-c:#35AE6B; --g-t:#1C3328; --g-i:#8FDDB1; --g-on:#FFFFFF;
  --b-c:#4A84EE; --b-t:#1E2A42; --b-i:#A3C2FF; --b-on:#FFFFFF;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25);
}}
*{box-sizing:border-box;margin:0;padding:0}
html{height:100%;touch-action:manipulation;-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{position:fixed;inset:0;overflow:hidden;background-color:var(--paper);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:18px 18px;color:var(--ink);
  font-family:ui-rounded,"SF Pro Rounded",-apple-system,BlinkMacSystemFont,system-ui,"Segoe UI",Roboto,sans-serif;
  font-size:16px;line-height:1.35;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
  -webkit-tap-highlight-color:transparent;overscroll-behavior:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
button:disabled{cursor:default}
button:focus-visible{outline:3px solid var(--b-c);outline-offset:2px}
input{font:inherit}
svg{display:block}
#app{position:absolute;inset:0;display:flex;flex-direction:column;padding:var(--st) var(--sr) 0 var(--sl)}
.screen{flex:1;display:flex;flex-direction:column;min-height:0;width:100%;max-width:560px;margin:0 auto}
.scroll{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.k0{--c:var(--r-c);--t:var(--r-t);--i:var(--r-i);--on:var(--r-on)}
.k1{--c:var(--y-c);--t:var(--y-t);--i:var(--y-i);--on:var(--y-on)}
.k2{--c:var(--g-c);--t:var(--g-t);--i:var(--g-i);--on:var(--g-on)}
.k3{--c:var(--b-c);--t:var(--b-t);--i:var(--b-i);--on:var(--b-on)}

/* Kopfzeile */
.top{display:flex;align-items:center;gap:6px;padding:4px 8px;min-height:56px}
.ib{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;color:var(--ink2);flex:none}
.ib:active{background:var(--card2)}
.ib svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.who{flex:1;min-width:0;display:flex;align-items:center;gap:10px}
.who>div{min-width:0}
.nm{font-weight:800;font-size:19px;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sub{font-size:13px;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.av{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:800;font-size:16px;flex:none;position:relative}
.av .bt{position:absolute;right:-5px;bottom:-5px;width:20px;height:20px;border-radius:50%;background:var(--card);color:var(--ink);display:grid;place-items:center;box-shadow:0 0 0 2px var(--paper)}
.av .bt svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.av.big{width:88px;height:88px;font-size:38px}
.av.big .bt{width:32px;height:32px;right:-4px;bottom:-4px}
.av.big .bt svg{width:20px;height:20px}
.pill{min-width:66px;height:44px;border-radius:12px;background:var(--card);box-shadow:var(--shadow);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0 10px;flex:none}
.pill b{font-size:19px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.pens{display:flex;gap:3px;margin-top:4px}
.pen{width:9px;height:9px;border-radius:2.5px;box-shadow:inset 0 0 0 1.5px var(--ink3)}
.pen.on{background:var(--danger);box-shadow:none}

/* Würfel */
.tray{display:flex;align-items:center;gap:8px;padding:4px 12px 6px;min-height:54px}
.dice{display:flex;gap:7px;flex:1;min-width:0}
.die{width:40px;height:40px;border-radius:10px;display:grid;grid-template:repeat(3,1fr)/repeat(3,1fr);padding:6px;flex:none;position:relative;
  background:#FFFFFF;box-shadow:inset 0 0 0 1.5px rgba(0,0,0,.13),0 2px 5px rgba(0,0,0,.13)}
.die i{width:7px;height:7px;border-radius:50%;background:#1D2127;place-self:center}
.die.k{background:var(--c);box-shadow:inset 0 0 0 1.5px rgba(0,0,0,.08),0 2px 5px rgba(0,0,0,.15)}
.die.k i{background:var(--on)}
.die.blank{background:transparent;box-shadow:inset 0 0 0 2px var(--line)}
.die.blank.k{box-shadow:inset 0 0 0 2px var(--c);opacity:.5}
.die.gone{background:transparent;box-shadow:inset 0 0 0 2px var(--line);opacity:.6;display:grid;place-items:center;padding:0}

.sum,.banner>span:last-child,.opts,.botline{transition:opacity .25s ease-out}

.cell.ok:active,.cell.pick:active{transform:scale(.94)}
.cell.pick{background:var(--c);color:var(--on);z-index:1;box-shadow:0 0 0 2px var(--paper),0 0 0 4.5px var(--ink)}
.cell.pick .x path{stroke:var(--on)}
.cell.pick .n{opacity:.45}
.cell.lost{opacity:.3}
.cell.lost::after{content:"";position:absolute;left:24%;right:24%;top:50%;height:2px;margin-top:-1px;background:currentColor;transform:rotate(-14deg);border-radius:2px}
.cell.shut{opacity:.35}
.cell .lk{position:absolute;top:5px;right:6px;width:13px;height:13px;fill:none;stroke:currentColor;stroke-width:2.2;opacity:.75}
.cell .lk.on{fill:currentColor;opacity:1}
.mini .cell .lk{width:10px;height:10px;top:3px;right:4px}
.cell .need{position:absolute;bottom:4px;right:6px;font-size:10px;font-weight:800;opacity:.75;line-height:1}

.x{position:absolute;inset:12% 22%;width:auto;height:auto;transform:rotate(var(--rot,0deg));pointer-events:none;overflow:visible;z-index:1}
.x path{fill:none;stroke:var(--pen);stroke-width:4.4;stroke-linecap:round}

/* Untere Leiste */

.btn.sq{width:52px;padding:0;flex:none}

/* Overlays */

.rules h3{font-size:16px;font-weight:900;margin:16px 0 4px}

.ptab{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin-top:8px}

table.sc{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.sc th{font-size:12px;font-weight:800;color:var(--ink2);padding:6px 3px;text-align:right}

/* Übergabe */

/* Start, Setup, Ende */
.home{flex:1;display:flex;flex-direction:column;justify-content:center;padding:24px 22px calc(var(--sb) + 18px);gap:26px}

.stack{display:flex;flex-direction:column;gap:12px}

.win{padding:8px 16px 4px;text-align:center}

.box{background:var(--card);border-radius:16px;box-shadow:var(--shadow);padding:6px 12px 8px;margin:10px 12px}

#toast{position:fixed;left:50%;bottom:calc(max(10px,var(--sb)) + 74px);transform:translate(-50%,10px);opacity:0;z-index:40;width:max-content;max-width:calc(100% - 32px);background:var(--ink);color:var(--paper);padding:11px 16px;border-radius:14px;font-weight:800;font-size:15px;line-height:1.35;transition:opacity .2s,transform .2s;pointer-events:none;text-align:center;white-space:pre-line;box-shadow:0 8px 24px rgba(0,0,0,.2)}
#toast.show{opacity:1;transform:translate(-50%,0)}
#toast.bad{background:var(--danger);color:#fff}
#toast.good{background:var(--ok);color:#fff}
/* Reihe geschlossen */
.closefx{position:fixed;inset:0;z-index:30;display:grid;place-items:center;pointer-events:none}
.cfx{background:var(--c);color:var(--on);border-radius:28px;padding:20px 34px 18px;display:flex;flex-direction:column;align-items:center;gap:2px;box-shadow:0 20px 60px rgba(0,0,0,.28);animation:stamp 1.7s cubic-bezier(.2,.9,.3,1.15) both}
.cfx svg{width:56px;height:56px;fill:currentColor;margin-bottom:6px}
.cfx svg path+path{fill:none;stroke:currentColor;stroke-width:2.2}
.cfx b{font-size:32px;font-weight:900;line-height:1.05}
.cfx span{font-size:17px;font-weight:800;opacity:.9}
@keyframes stamp{0%{transform:scale(2.3) rotate(-14deg);opacity:0}13%{transform:scale(.9) rotate(3deg);opacity:1}21%{transform:scale(1.05) rotate(-1deg)}29%{transform:none}82%{opacity:1;transform:none}100%{opacity:0;transform:translateY(-24px) scale(.94)}}
.cell.shine{animation:shine .7s ease-out both}
@keyframes shine{40%{transform:scale(1.1);filter:brightness(1.3) saturate(1.3)}100%{transform:none}}
/* Fehlwurf */
.penfx{position:fixed;inset:0;z-index:35;pointer-events:none;display:grid;place-items:center;animation:penflash 1.15s ease-out both}
.penfx b{font-size:60px;font-weight:900;line-height:1;color:#fff;background:var(--danger);padding:14px 30px;border-radius:26px;box-shadow:0 16px 44px rgba(150,20,10,.35);animation:penrise 1.15s cubic-bezier(.2,.8,.3,1) both}
@keyframes penflash{0%{box-shadow:inset 0 0 140px 50px rgba(220,50,40,.6)}100%{box-shadow:inset 0 0 140px 50px rgba(220,50,40,0)}}
@keyframes penrise{0%{transform:scale(.4);opacity:0}25%{transform:scale(1.1);opacity:1}60%{transform:scale(1);opacity:1}100%{transform:translateY(-60px);opacity:0}}

@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}

<body>
<div id="app"></div>
<div id="toast" role="status" aria-live="polite"></div>

<script id="engine">
/* ===== Spiellogik (ohne Oberfläche) ===== */
const Engine = (() => {
  const LAST = 10;                       // Index des letzten Feldes (12 bzw. 2)
  const ROW_NAMES = ['Rot', 'Gelb', 'Grün', 'Blau'];
  const numAt = (r, i) => (r < 2 ? i + 2 : 12 - i);   // Index -> Zahl
  const idxOf = (r, n) => (r < 2 ? n - 2 : 12 - n);   // Zahl -> Index
  const tri = n => n * (n + 1) / 2;                   // Wertung bei n Kreuzen
  const ways = n => 6 - Math.abs(7 - n);              // Wahrscheinlichkeit einer Summe (x/36)
  const clone = o => JSON.parse(JSON.stringify(o));

  function newPlayer(name, bot, level) {
    return { name, bot: !!bot, level: bot ? (level || 'normal') : undefined, marks: [0, 1, 2, 3].map(() => Array(11).fill(false)), lock: [false, false, false, false], pen: 0 };
  }
  function newGame(list, starter = 0) {
    return {
      v: 1, players: list.map(p => newPlayer(p.name, p.bot, p.level)), starter, active: starter,
      phase: 'roll', step: 0, dice: null, closedAtRoll: [false, false, false, false],
      turn: null, pending: {}, rolls: 0, over: null, holder: -1
    };
  }

  const crosses = (p, r) => p.marks[r].reduce((a, b) => a + (b ? 1 : 0), 0);
  const lastIdx = (p, r) => p.marks[r].lastIndexOf(true);
  const rowCount = (p, r) => crosses(p, r) + (p.lock[r] ? 1 : 0);
  const rowScore = (p, r) => tri(rowCount(p, r));
  const total = p => [0, 1, 2, 3].reduce((s, r) => s + rowScore(p, r), 0) - 5 * p.pen;
  const closedRows = g => [0, 1, 2, 3].map(r => g.players.some(p => p.lock[r]));
  const closedCount = g => closedRows(g).filter(Boolean).length;

  function canMark(p, r, idx, closed) {
    if (closed[r]) return false;
    if (idx < 0 || idx > LAST) return false;
    if (idx <= lastIdx(p, r)) return false;              // nur nach rechts
    if (idx === LAST && crosses(p, r) < 5) return false; // Schloss erst ab 5 Kreuzen
    return true;
  }
  const skipped = (p, r, idx) => idx - lastIdx(p, r) - 1;
  const whiteSum = g => g.dice.w[0] + g.dice.w[1];
  const passive = g => { const n = g.players.length, out = []; for (let k = 1; k < n; k++) out.push((g.active + k) % n); return out; };

  // Schritt 1: Für alle gilt der Stand der geschlossenen Reihen VOR dem Wurf (gleichzeitig)
  function whiteOptions(g, pi) {
    if (!g.dice) return [];
    const p = g.players[pi], s = whiteSum(g), out = [];
    for (let r = 0; r < 4; r++) {
      const idx = idxOf(r, s);
      if (canMark(p, r, idx, g.closedAtRoll)) out.push({ r, idx, n: s, skip: skipped(p, r, idx) });
    }
    return out;
  }
  // Schritt 2: nur aktiver Spieler, aktuelle Sperren (auch frisch in Schritt 1 geschlossene)
  function colorOptionsFor(g, p, closed) {
    const out = [];
    if (!g.dice) return out;
    for (let r = 0; r < 4; r++) {
      const c = g.dice.c[r];
      if (c == null || closed[r]) continue;
      const seen = {};
      for (const w of g.dice.w) {
        const n = w + c, idx = idxOf(r, n);
        if (seen[idx]) continue;
        seen[idx] = 1;
        if (canMark(p, r, idx, closed)) out.push({ r, idx, n, w, c, skip: skipped(p, r, idx) });
      }
    }
    return out;
  }
  const colorOptions = g => colorOptionsFor(g, g.players[g.active], closedRows(g));
  const has = (list, r, idx) => list.some(o => o.r === r && o.idx === idx);

  function applyMark(p, r, idx) { p.marks[r][idx] = true; if (idx === LAST) p.lock[r] = true; }
  const d6 = rng => 1 + Math.floor(rng() * 6);

  function roll(g, rng = Math.random) {
    if (g.phase !== 'roll') throw new Error('Gerade wird nicht gewürfelt');
    const closed = closedRows(g);
    g.dice = { w: [d6(rng), d6(rng)], c: [0, 1, 2, 3].map(r => (closed[r] ? null : d6(rng))) };
    g.closedAtRoll = closed;
    g.rolls++;
    g.turn = { white: null, color: null, pen: false, bot: null };
    g.pending = {};
    g.phase = 'others';
    g.step = 1;
    return g;
  }
  function setPending(g, pi, choice) {
    if (g.phase !== 'others' || pi === g.active) throw new Error('Keine Wahl möglich');
    if (choice === 'none') g.pending[pi] = 'none';
    else if (choice == null) delete g.pending[pi];
    else {
      if (!has(whiteOptions(g, pi), choice.r, choice.idx)) throw new Error('Ungültiges Feld');
      g.pending[pi] = { r: choice.r, idx: choice.idx };
    }
  }
  const undecided = g => passive(g).filter(i => !(i in g.pending));
  function commitOthers(g) {
    if (g.phase !== 'others') throw new Error('Falsche Phase');
    if (undecided(g).length) throw new Error('Noch nicht alle haben entschieden');
    for (const i of passive(g)) {
      const c = g.pending[i];
      if (c && c !== 'none') applyMark(g.players[i], c.r, c.idx);
    }
    g.phase = 'active';
    g.step = 1;
  }
  function finish(g) {
    g.phase = 'over';
    g.over = { rows: closedCount(g) >= 2, pen: g.players.map((p, i) => (p.pen >= 4 ? i : -1)).filter(i => i >= 0) };
  }
  function afterStep1(g) {
    if (closedCount(g) >= 2) return finish(g);   // Spielende sofort, Schritt 2 entfällt
    g.step = 2;
  }
  function markWhite(g, r, idx) {
    if (g.phase !== 'active' || g.step !== 1) throw new Error('Nicht Schritt 1');
    if (!has(whiteOptions(g, g.active), r, idx)) throw new Error('Ungültiges Feld');
    applyMark(g.players[g.active], r, idx);
    g.turn.white = { r, idx, n: numAt(r, idx) };
    afterStep1(g);
  }
  function skipWhite(g) {
    if (g.phase !== 'active' || g.step !== 1) throw new Error('Nicht Schritt 1');
    afterStep1(g);
  }
  function markColor(g, r, idx) {
    if (g.phase !== 'active' || g.step !== 2) throw new Error('Nicht Schritt 2');
    const o = colorOptions(g).find(x => x.r === r && x.idx === idx);
    if (!o) throw new Error('Ungültiges Feld');
    applyMark(g.players[g.active], r, idx);
    g.turn.color = { r, idx, n: o.n, w: o.w, c: o.c };
    g.step = 3;
  }
  function endTurn(g) {
    if (g.phase !== 'active' || g.step < 2) throw new Error('Zug kann noch nicht enden');
    const p = g.players[g.active];
    if (!g.turn.white && !g.turn.color) { p.pen++; g.turn.pen = true; }   // Fehlwurf nur für den aktiven Spieler
    if (p.pen >= 4 || closedCount(g) >= 2) return finish(g);
    g.active = (g.active + 1) % g.players.length;
    g.phase = 'roll';
    g.step = 0;
    g.dice = null;
    g.pending = {};
  }
  function ranking(g) {
    const arr = g.players.map((p, i) => ({ i, total: total(p) })).sort((a, b) => b.total - a.total || a.i - b.i);
    arr.forEach((e, k) => { e.place = k > 0 && e.total === arr[k - 1].total ? arr[k - 1].place : k + 1; });
    return arr;
  }

  /* ----- Computergegner in drei Stärken -----
     Grundidee: Ein Kreuz ist etwas wert (mehr in vollen Reihen), übersprungene Felder kosten
     (wahrscheinliche Zahlen mehr), Schließen lohnt sich, Fehlwürfe werden vermieden.
     Gegen Spielende wird mutiger gekreuzt.
     leicht: achtlos beim Überspringen, nimmt Fehlwürfe eher hin, macht gelegentlich Zufallszüge.
     schwer: gewichtet Kreuze, volle Reihen und übersprungene Felder je nach Tischgröße anders.
     Die Werte für "schwer" sind per Simulation gegen einen Durchschnittsspieler eingestellt. */
  const LEVELS = ['leicht', 'normal', 'schwer'];
  let botRng = Math.random;
  // [Grundwert Kreuz, Bonus je Kreuz in der Reihe, Gewicht übersprungener Felder]
  const SCHWER_BY_SIZE = { 2: [6, 0.8, 1.5], 3: [6, 0.5, 1.1], 4: [8, 0.5, 1.1], 5: [6, 0.5, 0.9] };
  function botCtx(g, pi) {
    const me = g.players[pi], level = me.level || 'normal';
    const maxPen = Math.max(...g.players.map(p => p.pen));
    const urg = (closedCount(g) >= 1 ? 1 : 0) + (maxPen >= 3 ? 1 : 0);
    if (level === 'leicht') return { cross: 3 + 2 * urg, perN: 0.2, skipW: 0.45, lock: 3, pen: me.pen >= 3 ? 25 : 6, noise: 0.3 };
    if (level === 'schwer') {
      // Je nach Tischgröße andere Werte (per Simulation gegen Durchschnittsspieler ermittelt)
      const size = Math.min(5, Math.max(2, g.players.length));
      const bots = g.players.filter(x => x.bot).length;
      // Einzelner Computer gegen mehrere Menschen: eigene Werte
      const [c, n, s] = bots === 1 ? [6, 0.8, size >= 4 ? 0.8 : 1.5] : SCHWER_BY_SIZE[size];
      return { cross: c + 3 * urg, perN: n, skipW: s, lock: 8, pen: me.pen >= 3 ? 200 : 10 };
    }

  }
  function markUtil(p, r, idx, ctx) {
    let skip = 0;

    let u = ctx.cross + ctx.perN * crosses(p, r) - ctx.skipW * skip;
    if (idx === LAST) u += ctx.lock;
    return u;
  }
  function botPassive(g, pi) {
    const p = g.players[pi], ctx = botCtx(g, pi), opts = whiteOptions(g, pi);
    if (ctx.noise && botRng() < ctx.noise) {
      const o = opts[Math.floor(botRng() * (opts.length + 1))];
      return o ? { r: o.r, idx: o.idx } : 'none';
    }
    let best = null, bu = 0;
    for (const o of opts) {
      const u = markUtil(p, o.r, o.idx, ctx);
      if (u > bu) { bu = u; best = o; }
    }

  }
  function botActivePlan(g) {
    const pi = g.active, p = g.players[pi], ctx = botCtx(g, pi);
    const closedNow = closedRows(g);
    const plans = [];
    for (const w of [null, ...whiteOptions(g, pi)]) {
      const q = clone(p);
      let uw = 0;
      if (w) { uw = markUtil(p, w.r, w.idx, ctx); applyMark(q, w.r, w.idx); }
      const closed = closedNow.slice();
      if (w && w.idx === LAST) closed[w.r] = true;
      const ends = closed.filter(Boolean).length >= 2;
      for (const c of ends ? [null] : [null, ...colorOptionsFor(g, q, closed)]) {
        let u = uw + (c ? markUtil(q, c.r, c.idx, ctx) : 0);
        if (!w && !c && !ends) u = -ctx.pen;
        plans.push({ white: w, color: c, u });
      }
    }
    if (ctx.noise && botRng() < ctx.noise) {
      const safe = plans.filter(x => x.white || x.color);
      const pool = safe.length ? safe : plans;
      return pool[Math.floor(botRng() * pool.length)];
    }
    return plans.reduce((a, b) => (b.u > a.u ? b : a));
  }
  function botPlayActive(g) {
    if (g.phase !== 'active' || g.step !== 1) throw new Error('Bot: falsche Phase');
    const plan = botActivePlan(g);
    if (plan.white) markWhite(g, plan.white.r, plan.white.idx); else skipWhite(g);
    if (g.phase === 'active' && plan.color) markColor(g, plan.color.r, plan.color.idx);
    g.turn.bot = { white: g.turn.white, color: g.turn.color };
    return g.turn.bot;
  }

  return {
    LAST, ROW_NAMES, numAt, idxOf, tri, ways, clone, newGame, crosses, lastIdx, rowCount, rowScore, total,
    closedRows, closedCount, canMark, whiteSum, whiteOptions, colorOptions, colorOptionsFor, passive,
    roll, setPending, undecided, commitOthers, markWhite, skipWhite, markColor, endTurn, ranking,
    botPassive, botActivePlan, botPlayActive, LEVELS, setBotRng: f => { botRng = f; }
  };
})();
if (typeof module !== 'undefined') module.exports = Engine;
</script>

<script>

/* ---------- Töne (Web Audio, alles synthetisch erzeugt) ---------- */
const Sound = (() => {
  let ctx = null, master = null, noiseBuf = null;

function confetti({ x = 0.5, y = 0.5, angle = -90, spread = 60, speed = 14, count = 120, colors, duration = 3600, gravity = 0.32 } = {}) {

function celebrateClose(rows) {
  rows.forEach((r, k) => later(() => {
    Sound.close();
    const el = document.createElement('div');
    el.className = `closefx k${r}`;
    el.innerHTML = `<div class="cfx">${I.lock}<b>${RN[r]}</b><span>ist geschlossen</span></div>`;
    document.body.appendChild(el);

  }, 80 + k * 1100));
}
function penaltyFx() {

/* ---------- Toast ---------- */
let toastT = null;
function toast(text, kind) {
  if (!text) return;
  if (rollingNow()) return later(() => toast(text, kind));
  toastEl.textContent = text;
  toastEl.className = 'show' + (kind ? ' ' + kind : '');
  clearTimeout(toastT);
  toastT = setTimeout(() => { toastEl.className = ''; }, 2600);
}

/* ---------- Aktionen mit Rückgängig ---------- */
function act(fn, undoable) {
  const g = G();
  const snap = undoable ? E.clone(g) : null;
  const closedBefore = E.closedRows(g);
  try { fn(g); }
  catch (e) { console.warn(e); if (snap) store.game = snap; render(); return false; }
  if (snap) { store.undo.push(snap); if (store.undo.length > 40) store.undo.shift(); }
  announceClosures(closedBefore);
  save();
  render();
  return true;
}
function announceClosures(before) {
  const g = G();
  const now = E.closedRows(g);
  const fresh = [0, 1, 2, 3].filter(r => now[r] && !before[r]);
  if (fresh.length) celebrateClose(fresh);
}
function undo() {
  if (!store.undo.length) return;
  Sound.undo();
  store.game = store.undo.pop();
  ui.view = null;
  ui.fresh.clear();
  save();
  render();
}

function doRoll() {
  const g = G();
  const before = E.closedRows(g);
  E.roll(g);
  store.undo = [];
  store.note = '';
  ui.view = null;
  startRollFx();
  if (!g.players[g.active].bot) g.holder = g.active;
  for (const i of E.passive(g)) if (g.players[i].bot) E.setPending(g, i, E.botPassive(g, i));
  if (!humanPassives(g).length) commitWithNotes();
  announceClosures(before);
  save();
  render();
}
function commitWithNotes() {
  const g = G();
  const notes = [];
  for (const i of E.passive(g)) {
    const c = g.pending[i];
    if (g.players[i].bot && c && c !== 'none') notes.push(`${g.players[i].name} kreuzt ${RN[c.r]} ${E.numAt(c.r, c.idx)}`);
  }
  E.commitOthers(g);
  for (const i of E.passive(g)) { const c = g.pending[i]; if (c && c !== 'none') ui.fresh.add(`${i}-${c.r}-${c.idx}`); }
  if (notes.length) toast(notes.join('\n'));
}
function pickPassive(pi, r, idx) {
  const g = G();
  const cur = g.pending[pi];
  if (r == null) { E.setPending(g, pi, 'none'); Sound.pick(); }
  else if (cur && cur !== 'none' && cur.r === r && cur.idx === idx) { E.setPending(g, pi, null); Sound.undo(); }
  else { E.setPending(g, pi, { r, idx }); ui.fresh.add(`${pi}-${r}-${idx}`); Sound.mark(); }
  save();
  render();
}
function commitOthersAction() {
  const g = G();
  const closedBefore = E.closedRows(g);
  const snap = E.clone(g);
  try { commitWithNotes(); } catch (e) { console.warn(e); return; }
  store.undo.push(snap);
  announceClosures(closedBefore);
  ui.view = null;
  save();
  render();
}
function markCell(r, idx) {
  const g = G();
  if (g.phase !== 'active') return;
  const key = `${g.active}-${r}-${idx}`;
  ui.fresh.add(key);
  if (act(gg => (gg.step === 1 ? E.markWhite(gg, r, idx) : E.markColor(gg, r, idx)), true)) Sound.mark();
  else ui.fresh.delete(key);
}
function endTurn(force) {
  const g = G();
  const p = g.players[g.active];
  const noMark = !g.turn.white && !g.turn.color;
  if (noMark && !force && g.step === 2 && E.colorOptions(g).length) {
    return ask('Wirklich nichts ankreuzen? Das gibt einen Fehlwurf (−5).', 'Fehlwurf nehmen', () => endTurn(true), true);
  }
  if (act(gg => E.endTurn(gg), true)) {
    if (g.turn.pen) {
      store.note = `${p.name} hat einen Fehlwurf bekommen (${p.pen} von 4).`;
      toast(`Fehlwurf für ${p.name}: −5`, 'bad');
      penaltyFx();
      save();
    } else store.note = '';
  }
}
function botContinue() {
  const g = G();
  const p = g.players[g.active];
  E.endTurn(g);
  store.undo = [];
  store.note = g.turn.pen ? `${p.name} hat einen Fehlwurf bekommen (${p.pen} von 4).` : '';
  if (g.turn.pen) { toast(`Fehlwurf für ${p.name}: −5`, 'bad'); penaltyFx(); }
  save();
  render();
}

/* ---------- Ablaufsteuerung für Computergegner ---------- */
function tick() {
  clearTimeout(ui.timer);
  ui.timer = null;
  const g = G();
  if (!g || ui.screen !== 'game' || ui.confirm || ui.overlay) return;   // Computer pausiert, solange ein Fenster offen ist
  const A = g.players[g.active];
  if (g.phase === 'roll' && A.bot) ui.timer = setTimeout(doRoll, 900);
  else if (g.phase === 'others' && !humanPassives(g).length) ui.timer = setTimeout(() => { commitWithNotes(); save(); render(); }, 50);
  else if (g.phase === 'active' && A.bot && g.step === 1 && !g.turn.bot) {
    ui.timer = setTimeout(() => {
      const before = E.closedRows(g);
      const info = E.botPlayActive(g);
      if (info.white) ui.fresh.add(`${g.active}-${info.white.r}-${info.white.idx}`);
      if (info.color) ui.fresh.add(`${g.active}-${info.color.r}-${info.color.idx}`);
      if (info.white || info.color) Sound.mark();
      announceClosures(before);
      save();
      render();
    }, 750);
  }
}

/* ---------- Bausteine ---------- */
function topBar(g, pi, sub) {
  const p = g.players[pi];
  return `<div class="top">
    <button class="ib" data-a="menu" aria-label="Menü">${I.menu}</button>
    <div class="who">${avatar(g, pi)}<div><div class="nm">${esc(p.name)}</div><div class="sub">${sub}</div></div></div>
    <button class="pill" data-a="scores" aria-label="Punktestand aller Spieler"><b>${E.total(p)}</b><span class="pens">${[0, 1, 2, 3].map(k => `<span class="pen${k < p.pen ? ' on' : ''}"></span>`).join('')}</span></button>
    <button class="ib" data-a="rules" aria-label="Regeln">${I.help}</button>
  </div>`;
}
function trayHTML(g, mode) {
  const closed = E.closedRows(g);
  const d = g.dice;
  const step1 = d && (g.phase === 'others' || (g.phase === 'active' && g.step === 1));
  const st = i => (d ? rollStyle(i) : null);
  const anim = i => (st(i) ? ' rolling' : '');
  let html = '<div class="tray"><div class="dice">';
  html += dieHTML(d ? d.w[0] : null, 'w', anim(0), st(0)) + dieHTML(d ? d.w[1] : null, 'w', anim(1), st(1));
  for (let r = 0; r < 4; r++) {
    const gone = d ? d.c[r] == null || (closed[r] && g.phase === 'active' && g.step >= 2) : closed[r];
    if (gone) html += `<div class="die k k${r} gone" aria-label="${RN[r]} weg">${I.lock}</div>`;
    else html += dieHTML(d ? d.c[r] : null, r, (step1 ? 'dim' : '') + anim(r + 2), st(r + 2));
  }
  html += '</div>';
  if (step1) html += `<div class="sum"><small>Weiß</small><b>${E.whiteSum(g)}</b></div>`;
  return html + '</div>';
}
function sheetHTML(g, pi, opt) {
  const p = g.players[pi];
  const closed = E.closedRows(g);
  const valid = new Set((opt.valid || []).map(o => o.r + '-' + o.idx));
  const pick = opt.pick && opt.pick !== 'none' ? opt.pick : null;
  let heads = '<div class="heads">';
  for (let r = 0; r < 4; r++) {
    heads += `<div class="head k${r}${closed[r] ? ' closed' : ''}"><span class="hn">${RN[r]}${closed[r] ? I.lock : ''}</span><span class="hc">${E.rowCount(p, r)} ✕</span><b>${E.rowScore(p, r)}</b></div>`;
  }
  heads += '</div>';
  let cells = `<div class="sheet${opt.mini ? ' mini' : ''}">`;
  for (let r = 0; r < 4; r++) {
    const last = E.lastIdx(p, r);
    for (let i = 0; i < 11; i++) {
      const n = E.numAt(r, i);
      const marked = p.marks[r][i];
      const isPick = pick && pick.r === r && pick.idx === i;
      const ok = !opt.mini && valid.has(r + '-' + i);
      let cls = `cell k${r}`;
      if (marked) cls += ' done';
      else if (isPick) cls += ' pick';
      else if (ok) cls += ' ok';
      else if (i < last) cls += ' lost';
      else if (closed[r]) cls += ' shut';
      let inner = `<span class="n">${n}</span>`;
      if (i === E.LAST) {
        inner += lockCell(p.lock[r]);
        if (!marked && !closed[r] && !isPick) inner += `<span class="need">${Math.min(E.crosses(p, r), 5)}/5</span>`;
      }
      if (marked || isPick) inner += crossSVG(r * 11 + i + pi * 7, ui.fresh.has(`${pi}-${r}-${i}`));
      const label = `${RN[r]} ${n}${marked ? ', angekreuzt' : ''}${i === E.LAST ? ', Schlussfeld' : ''}`;
      if ((ok || isPick) && opt.action) cells += `<button class="${cls}" data-a="${opt.action}" data-pi="${pi}" data-r="${r}" data-i="${i}" aria-label="${label} ankreuzen">${inner}</button>`;
      else cells += `<div class="${cls}" aria-label="${label}">${inner}</div>`;
    }
  }
  cells += '</div>';
  return opt.mini ? heads + cells : heads + `<div class="sheetwrap" data-keep="sheet${pi}">${cells}</div>`;
}
function bar(left, right) { return `<div class="bar">${left || ''}${right || ''}</div>`; }
const undoBtn = () => `<button class="btn sec sq" data-a="undo" aria-label="Rückgängig" ${store.undo.length ? '' : 'disabled'}>${I.undo}</button>`;
function banner(step, text, kind) { return `<div class="banner${kind ? ' ' + kind : ''}">${step ? `<span class="st">${step}</span>` : ''}<span>${text}</span></div>`; }
const optLabel = o => o.skip > 0 ? `${o.skip} verfallen` : (o.idx === E.LAST ? 'schließt' : 'direkt');
function colorMove(c) { return `${RN[c.r]} ${c.n} (Weiß ${c.w} + ${RN[c.r]} ${c.c})`; }

function gameHTML(g) {
  if (g.phase === 'over') return overHTML(g);
  if (g.phase === 'others') {
    if (ui.view != null && g.players[ui.view] && !g.players[ui.view].bot && ui.view !== g.active) return passiveScreen(g, ui.view, 'table');
    const hp = humanPassives(g);
    if (hp.length === 1) return passiveScreen(g, hp[0], 'direct');
    if (hp.length > 1) return tableScreen(g);
    return activeScreen(g);
  }
  return activeScreen(g);
}

function activeScreen(g) {
  const pi = g.active, p = g.players[pi];
  let sub, ban, right, left = undoBtn(), valid = [], action = null;
  if (p.bot) {
    sub = `Computer, ${LEVEL_NAME[p.level || 'normal'].toLowerCase()}`;
    left = g.turn && g.turn.bot && store.undo.length ? undoBtn() : '';
    if (g.phase === 'roll') { ban = banner('', `${esc(p.name)} würfelt gleich …`, 'bot'); right = `<button class="btn pri" disabled>${esc(p.name)} ist dran</button>`; }
    else if (!g.turn.bot) { ban = banner('', `${esc(p.name)} überlegt …`, 'bot'); right = `<button class="btn pri" disabled>${esc(p.name)} ist dran</button>`; }
    else {
      const b = g.turn.bot, parts = [];
      if (b.white) parts.push(`Weiß ${b.white.n} bei ${RN[b.white.r]}`);
      if (b.color) parts.push(colorMove(b.color));
      const txt = parts.length ? `${esc(p.name)} kreuzt ${parts.join(' und ')}.` : `${esc(p.name)} kreuzt nichts an: Fehlwurf (−5).`;
      ban = banner('Zug', txt, parts.length ? 'bot' : 'warn');
      right = `<button class="btn pri" data-a="botnext">Weiter</button>`;
    }
  } else if (g.phase === 'roll') {
    sub = 'ist am Zug';
    ban = banner('', 'Du bist dran. Tippe auf Würfeln.');
    right = `<button class="btn pri" data-a="roll">Würfeln</button>`;
  } else if (g.step === 1) {
    sub = 'ist am Zug';
    valid = E.whiteOptions(g, pi);
    action = 'cell';
    const s = E.whiteSum(g);
    ban = valid.length ? banner('Schritt 1', `Weiße Summe ${s} in einer Reihe ankreuzen. Freiwillig.`) : banner('Schritt 1', `Die ${s} passt in keine deiner Reihen.`);
    right = valid.length ? `<button class="btn out" data-a="skipwhite">Weiß auslassen</button>` : `<button class="btn pri" data-a="skipwhite">Weiter zu Schritt 2</button>`;
  } else if (g.step === 2) {
    sub = 'ist am Zug';
    valid = E.colorOptions(g);
    action = 'cell';
    const none = !g.turn.white;
    if (valid.length) ban = banner('Schritt 2', none ? 'Weiß + Farbe kombinieren. Ohne Kreuz gibt es einen Fehlwurf.' : 'Optional: einen weißen und einen farbigen Würfel kombinieren.', none ? 'warn' : '');
    else ban = banner('Schritt 2', none ? 'Keine Kombination möglich. Das gibt einen Fehlwurf.' : 'Keine Kombination möglich.', none ? 'warn' : '');
    right = none ? `<button class="btn ${valid.length ? 'out' : 'bad'}" data-a="endturn">Fehlwurf nehmen (−5)</button>` : `<button class="btn pri" data-a="endturn">Zug beenden</button>`;
  } else {
    sub = 'ist am Zug';
    const endNow = E.closedCount(g) >= 2;

  }
  return `<div class="screen">${topBar(g, pi, sub)}${trayHTML(g)}${ban}${sheetHTML(g, pi, { valid, action })}${bar(left, right)}</div>`;
}

function passiveScreen(g, pi, mode) {
  const A = g.players[g.active];
  const valid = E.whiteOptions(g, pi);
  const pick = g.pending[pi];
  const s = E.whiteSum(g);
  const sub = `${esc(A.name)} hat gewürfelt`;
  const ban = valid.length ? banner('Schritt 1', `Du darfst die ${s} in einer Reihe ankreuzen. Freiwillig.`) : banner('Schritt 1', `Die ${s} passt in keine deiner Reihen.`);
  let left, right;
  const chosen = pick && pick !== 'none';
  if (mode === 'direct') {
    left = store.undo.length ? undoBtn() : '';
    right = `<button class="btn pri" data-a="commit-direct" data-pi="${pi}">${chosen ? `Weiter zu ${esc(A.name)}` : 'Ohne Kreuz weiter'}</button>`;
  } else {

  }
  return `<div class="screen">${topBar(g, pi, sub)}${trayHTML(g)}${ban}${sheetHTML(g, pi, { valid, pick, action: 'pcell' })}${bar(left, right)}</div>`;

function tableScreen(g) {
  const A = g.players[g.active];
  const s = E.whiteSum(g);
  const cards = E.passive(g).map(pi => {
    const p = g.players[pi];

    }
    const opts = E.whiteOptions(g, pi);
    const chosen = c && c !== 'none';
    let btns = '';
    for (let r = 0; r < 4; r++) {
      const o = opts.find(x => x.r === r);
      const sel = chosen && c.r === r;
      if (o) btns += `<button class="opt ok k${r}${sel ? ' sel' : ''}" data-a="pick" data-pi="${pi}" data-r="${r}" data-i="${o.idx}" aria-label="${RN[r]} ${s} ankreuzen">${s}<small>${sel ? 'gewählt' : optLabel(o)}</small></button>`;

    }

      <div class="opts${chosen ? ' has' : ''}">${btns}</div></section>`;
  }).join('');
  const wait = E.undecided(g).map(i => g.players[i].name);
  const right = wait.length
    ? `<button class="btn pri" disabled>Warte auf ${esc(wait.join(', '))}</button>`
    : `<button class="btn pri" data-a="commit">Weiter zu ${esc(A.name)}</button>`;
  return `<div class="screen">
    <div class="top"><button class="ib" data-a="menu" aria-label="Menü">${I.menu}</button>
      <div class="who">${avatar(g, g.active)}<div><div class="nm">${esc(A.name)} hat gewürfelt</div><div class="sub">Schritt 1 für alle anderen</div></div></div>
      <button class="ib" data-a="rules" aria-label="Regeln">${I.help}</button></div>
    ${trayHTML(g)}
    ${banner('Schritt 1', `Jeder darf die ${s} in einer Reihe ankreuzen. Freiwillig. Danach ist ${esc(A.name)} dran.`)}
    <div class="scroll" data-keep="table"><div class="cards">${cards}</div></div>
    ${bar('', right)}
  </div>`;
}

function scoreTable(g, tap) {
  const order = g.phase === 'over' ? E.ranking(g).map(e => e.i) : g.players.map((_, i) => i);
  return `<table class="sc"><thead><tr><th>Spieler</th>${RN.map((n, r) => `<th class="k${r}"><span class="dot" aria-label="${n}"></span></th>`).join('')}<th>Fehl</th><th>Summe</th></tr></thead><tbody>${order.map(i => {
    const p = g.players[i];
    return `<tr class="${i === g.active && g.phase !== 'over' ? 'act' : ''}${tap ? ' tap' : ''}" ${tap ? `data-a="peek" data-pi="${i}"` : ''}><td>${esc(p.name)}</td>${[0, 1, 2, 3].map(r => `<td>${E.rowScore(p, r)}</td>`).join('')}<td class="${p.pen ? 'neg' : ''}">${p.pen ? '−' + p.pen * 5 : '0'}</td><td class="tot">${E.total(p)}</td></tr>`;
  }).join('')}</tbody></table>`;
}

function overHTML(g) {
  const rk = E.ranking(g);
  const top = rk.filter(e => e.place === 1);
  const reasons = [];
  if (g.over && g.over.rows) reasons.push('Zwei Reihen sind geschlossen.');
  if (g.over && g.over.pen.length) reasons.push(g.over.pen.map(i => g.players[i].name).join(' und ') + ' hat vier Fehlwürfe.');
  const head = top.length > 1 ? `Gleichstand: ${top.map(e => esc(g.players[e.i].name)).join(' und ')}` : `${esc(g.players[top[0].i].name)} gewinnt`;
  return `<div class="screen">
    <div class="top"><button class="ib" data-a="home" aria-label="Startseite">${I.back}</button><div class="who"><div class="nm">Spielende</div></div><button class="ib" data-a="rules" aria-label="Regeln">${I.help}</button></div>
    <div class="scroll" data-keep="over">
      <div class="win"><div class="reason">${esc(reasons.join(' '))}</div><h2>${head}</h2></div>
      <div class="rank">${rk.map(e => `<div class="rk${e.place === 1 ? ' first' : ''}"><span class="pl">${e.place}.</span>${avatar(g, e.i)}<div class="grow"><div class="nm">${esc(g.players[e.i].name)}</div></div><b>${e.total}</b></div>`).join('')}</div>
      <div class="box">${scoreTable(g, true)}<p class="hint">Reihenpunkte plus Fehlwürfe ergeben die Summe. Tippe auf einen Namen, um das Blatt zu sehen.</p></div>
    </div>
    ${bar(`<button class="btn sec" data-a="home">Start</button>`, `<button class="btn pri" data-a="again">Revanche</button>`)}
  </div>`;
}

/* ---------- Overlays ---------- */
function rulesHTML() {
  const pts = Array.from({ length: 12 }, (_, k) => `<div><small>${k + 1} ✕</small><b>${E.tri(k + 1)}</b></div>`).join('');
  return `<div class="rules">
    <h3>Ziel</h3><p>Möglichst viele Kreuze in den vier Farbreihen. Rot und Gelb laufen von 2 bis 12, Grün und Blau von 12 bis 2.</p>
    <h3>Ein Wurf</h3><p>Wer am Zug ist, würfelt mit allen Würfeln. Dann:</p>
    <ol><li><b>Weiße Summe:</b> Alle dürfen die Summe der beiden weißen Würfel in einer beliebigen Reihe ankreuzen.</li>
    <li><b>Weiß + Farbe:</b> Nur wer am Zug ist, darf zusätzlich einen weißen und einen farbigen Würfel addieren und die Summe in der Reihe dieser Farbe ankreuzen.</li></ol>
    <p>Beides ist freiwillig. Kreuzt die Person am Zug in keinem der beiden Schritte etwas an, bekommt sie einen Fehlwurf (−5).</p>
    <h3>Immer weiter, nie zurück</h3><p>Jede Reihe wird der Reihe nach angekreuzt, hier von oben nach unten. Übersprungene Felder sind verloren.</p>
    <h3>Reihe schließen</h3><p>Das letzte Feld (12 bei Rot und Gelb, 2 bei Grün und Blau) geht erst, wenn in der Reihe schon 5 Kreuze stehen. Dazu gibt es das Schloss als zusätzliches Kreuz. Die Reihe ist dann für alle zu, ihr Würfel fällt weg. Wer dieselbe Zahl im selben Schritt nutzt, darf trotzdem noch ankreuzen.</p>
    <h3>Spielende</h3><p>Sobald jemand 4 Fehlwürfe hat oder zwei Reihen geschlossen sind. Wird die zweite Reihe schon in Schritt 1 geschlossen, entfällt Schritt 2.</p>
    <h3>Wertung pro Reihe</h3><div class="ptab">${pts}</div>
    <p style="margin-top:8px">Jeder Fehlwurf zählt −5. Die meisten Punkte gewinnen.</p>
    <h3>Bedienung</h3><p>Nur leuchtende Felder lassen sich antippen. Mit dem Pfeil links unten nimmst du Kreuze im laufenden Zug zurück. Der Spielstand bleibt gespeichert, auch wenn du die App schließt.</p>
  </div>`;
}
function overlayHTML() {
  const g = G();
  let html = '';
  // Übergabe-Bildschirm
  if (ui.screen === 'game' && g && g.phase === 'roll' && !g.players[g.active].bot && humans(g).length > 1 && g.holder !== g.active && ui.handDismissed !== g.active + ':' + g.rolls) {
    const p = g.players[g.active];
    html += `<div class="hand">${avatar(g, g.active, true)}<div class="lead">Weiter an</div><h2>${esc(p.name)}</h2>
      ${store.note ? `<p class="note">${esc(store.note)}</p>` : ''}
      <button class="btn pri" data-a="roll">Würfeln</button>
      <button class="link" data-a="handoff">Erst mein Blatt ansehen</button>
      ${store.undo.length ? `<button class="link" data-a="undo">Letzten Zug korrigieren</button>` : ''}</div>`;
  }
  const o = ui.overlay;
  if (o === 'rules') html += modal('Regeln', rulesHTML());
  else if (o === 'scores' && g) html += modal('Punktestand', scoreTable(g, true) + '<p class="hint">Reihenpunkte plus Fehlwürfe ergeben die Summe. Tippe auf einen Namen, um das Blatt zu sehen.</p>');
  else if (o && o.peek != null && g) {
    const p = g.players[o.peek];
    html += modal(esc(p.name), sheetHTML(g, o.peek, { mini: true }) + `<p class="hint">${E.total(p)} Punkte, ${p.pen} Fehlwürfe.</p>`, `<button class="btn sec wide" data-a="scores">Zurück zum Punktestand</button>`);
  } else if (o === 'menu') {
    html += modal('Menü', `<div class="menu">
      <button class="btn sec" data-a="scores">Punktestand</button>
      <button class="btn sec" data-a="rules">Regeln</button>
      <button class="btn sec" data-a="newgame">Neues Spiel</button>
      <button class="btn sec" data-a="mute">${store.muted ? 'Ton einschalten' : 'Ton ausschalten'}</button>
      <button class="btn sec" data-a="home">Zur Startseite</button></div><p class="hint">Das laufende Spiel bleibt gespeichert.</p>`);
  }
  if (ui.confirm) {
    const c = ui.confirm;
    html += `<div class="ov center" data-a="noconfirm"><div class="dialog" data-stop="1"><p>${esc(c.text)}</p><div class="row">
      <button class="btn out" data-a="noconfirm">Abbrechen</button><button class="btn ${c.danger ? 'bad' : 'pri'}" data-a="yesconfirm">${esc(c.yes)}</button></div></div></div>`;
  }
  return html;
}
function modal(title, body, foot) {
  return `<div class="ov" data-a="closeov"><div class="modal" data-stop="1" role="dialog" aria-label="${title}">
    <div class="mh"><h2>${title}</h2><button class="ib" data-a="closeov" aria-label="Schließen">${I.close}</button></div>
    <div class="mb">${body}</div>${foot ? `<div class="mf">${foot}</div>` : '<div class="mf"></div>'}</div></div>`;
}
function ask(text, yes, onYes, danger) { ui.confirm = { text, yes, danger }; ui.onYes = onYes; render(); }

/* ---------- Rendern ---------- */
function render() {
  const keep = {};
  app.querySelectorAll('[data-keep]').forEach(el => { keep[el.dataset.keep] = el.scrollTop; });
  const g = G();
  let html;
  if (ui.screen === 'setup') html = setupHTML();
  else if (ui.screen === 'game' && g) html = gameHTML(g);
  else { ui.screen = 'home'; html = homeHTML(); }
  app.innerHTML = html + overlayHTML();
  app.querySelectorAll('[data-keep]').forEach(el => { if (keep[el.dataset.keep] != null) el.scrollTop = keep[el.dataset.keep]; });
  app.classList.toggle('rolling', rollingNow());
  // Während des Wurfs zeigen die Würfel wechselnde Augen
  if (rollingNow() && performance.now() - ui.rollFx.t0 < 400) app.querySelectorAll('.die.rolling[data-v]').forEach(d => { d.innerHTML = pipsHTML(1 + Math.floor(Math.random() * 6)); });
  if (ui.fresh.size) setTimeout(() => { ui.fresh.clear(); }, 450);
  // Siegerbildschirm: einmal pro Partie feiern
  if (ui.screen === 'game' && g && g.phase === 'over') {
    const key = (g.id || 'x') + ':' + g.rolls;
    if (ui.celebrated !== key) { ui.celebrated = key; celebrateWin(); }
  }
  tick();
}

/* ---------- Eingaben ---------- */
function defaultSetup() { return [{ name: 'Spieler 1', bot: false }, { name: 'Spieler 2', bot: false }]; }
function nextBotName(list) { return BOTS.find(b => !list.some(p => p.name === b)) || 'Computer'; }

app.addEventListener('input', e => {
  const el = e.target;
  if (el.dataset.in != null && ui.setup) {
    ui.setup[+el.dataset.in].name = el.value;
    const av = el.parentElement.querySelector('.av');
    if (av && av.firstChild && av.firstChild.nodeType === 3) av.firstChild.nodeValue = (el.value.trim().charAt(0) || '?').toUpperCase();
  }
});
app.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.tagName === 'INPUT') e.target.blur(); });

app.addEventListener('click', e => {
  const el = e.target.closest('[data-a]');
  if (!el) return;
  // Tipp in den Inhalt eines Fensters schließt es nicht, nur Tipp daneben
  if (el.classList.contains('ov') && e.target !== el) return;
  const a = el.dataset.a;
  const g = G();
  const pi = el.dataset.pi != null ? +el.dataset.pi : null;
  switch (a) {
    case 'new':
    case 'newgame': {
      const go = () => { ui.overlay = null; ui.level = (g && (g.players.find(p => p.bot) || {}).level) || store.level || 'normal'; ui.setup = E.clone(g ? g.players.map(p => ({ name: p.name, bot: p.bot })) : (store.setup || defaultSetup())); ui.screen = 'setup'; render(); };
      if (g && g.phase !== 'over') return ask('Neues Spiel starten? Das laufende Spiel wird beendet.', 'Neues Spiel', () => { go(); }, true);
      return go();
    }
    case 'resume': ui.screen = 'game'; return render();
    case 'mute':
      store.muted = !store.muted;
      save();
      if (!store.muted) Sound.on();
      toast(store.muted ? 'Ton ist aus' : 'Ton ist an');
      return render();
    case 'home': ui.overlay = null; ui.screen = 'home'; return render();
    case 'rules': ui.overlay = 'rules'; return render();
    case 'menu': ui.overlay = 'menu'; return render();
    case 'scores': ui.overlay = 'scores'; return render();
    case 'peek': ui.overlay = { peek: pi }; return render();
    case 'closeov': ui.overlay = null; return render();
    case 'noconfirm': ui.confirm = null; return render();
    case 'yesconfirm': { const f = ui.onYes; ui.confirm = null; ui.onYes = null; if (f) f(); else render(); return; }
    case 'level': ui.level = el.dataset.l; return render();
    case 'add': {
      if (ui.setup.length >= 5) return;
      const bot = el.dataset.bot === '1';
      ui.setup.push({ name: bot ? nextBotName(ui.setup) : `Spieler ${ui.setup.filter(p => !p.bot).length + 1}`, bot });
      return render();
    }
    case 'remove': if (ui.setup.length > 1) ui.setup.splice(+el.dataset.i, 1); return render();
    case 'kind': {
      const p = ui.setup[+el.dataset.i];
      p.bot = !p.bot;
      if (p.bot && /^Spieler \d+$/.test(p.name)) p.name = nextBotName(ui.setup);
      else if (!p.bot && BOTS.includes(p.name)) p.name = `Spieler ${+el.dataset.i + 1}`;
      return render();
    }
    case 'start': {
      const list = ui.setup.map((p, i) => ({ name: (p.name || '').trim() || (p.bot ? nextBotName(ui.setup) : `Spieler ${i + 1}`), bot: p.bot, level: p.bot ? ui.level : undefined }));
      if (!list.some(p => !p.bot)) return;
      store.setup = list;
      store.level = ui.level;
      store.game = E.newGame(list, 0);
      store.game.id = Date.now();
      store.undo = [];
      store.note = '';
      ui.screen = 'game'; ui.view = null; ui.overlay = null; ui.handDismissed = -1;
      save();
      return render();
    }
    case 'again': {
      const list = g.players.map(p => ({ name: p.name, bot: p.bot, level: p.level }));
      store.game = E.newGame(list, ((g.starter || 0) + 1) % list.length);
      store.game.id = Date.now();
      store.undo = [];
      store.note = '';
      ui.view = null; ui.overlay = null;
      save();
      return render();
    }
    case 'roll': ui.overlay = null; return doRoll();
    case 'handoff': ui.handDismissed = g.active + ':' + g.rolls; return render();
    case 'undo': return undo();
    case 'cell': return markCell(+el.dataset.r, +el.dataset.i);
    case 'pcell': return pickPassive(pi, +el.dataset.r, +el.dataset.i);
    case 'pick':
      if (el.dataset.none) { pickPassive(pi, null); if (ui.view != null) { ui.view = null; render(); } return; }
      return pickPassive(pi, +el.dataset.r, +el.dataset.i);
    case 'view': ui.view = pi; return render();
    case 'closeview': ui.view = null; return render();
    case 'commit': return commitOthersAction();
    case 'commit-direct': {
      if (!(pi in g.pending)) E.setPending(g, pi, 'none');
      return commitOthersAction();
    }
    case 'skipwhite': return act(gg => E.skipWhite(gg), true);
    case 'endturn': return endTurn(false);
    case 'botnext': return botContinue();
  }
});
document.addEventListener('gesturestart', e => e.preventDefault());
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') save(); });

if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
  window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => {}); });
}
render();
window.__kb = { store: () => store, ui, E, Sound };
})();
</script>
</body>
</html>
